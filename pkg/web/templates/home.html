{{define "content"}}
<div class="card">
    <div class="card-body">
        <h4 class="card-title">欢迎使用 Gobox 管理后台</h4>
        <p class="text-muted">基于 Huma 框架和 Bootstrap 5 构建。</p>
        <p id="userInfo" class="mb-0"></p>
    </div>
</div>

<script>
(async function() {
    const token = App.getToken();
    if (!token) return;
    try {
        const result = await App.api('/admin/api/auth/check');
        if (result.authenticated && result.user) {
            document.getElementById('userInfo').textContent =
                '当前登录用户: ' + result.user.username + ' (' + result.user.email + ')';
        }
    } catch {}
})();
</script>
{{end}}
