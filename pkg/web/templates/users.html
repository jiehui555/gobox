{{define "content"}}
<article>
    <header>
        <nav>
            <ul>
                <li><strong>用户管理</strong> <small>共 {{len .Users}} 个用户</small></li>
            </ul>
            <ul>
                <li><button onclick="document.getElementById('create-user-modal').showModal()">创建用户</button></li>
            </ul>
        </nav>
    </header>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>角色</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {{range .Users}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Username}}</td>
                <td>{{.Email}}</td>
                <td>{{.Role}}</td>
                <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                <td><a href="#" onclick="deleteUser({{.ID}}, '{{.Username}}'); return false;" role="button" class="outline secondary">删除</a></td>
            </tr>
            {{end}}
        </tbody>
    </table>
</article>

<dialog id="create-user-modal">
    <article>
        <header>
            <button aria-label="Close" rel="prev" onclick="document.getElementById('create-user-modal').close()"></button>
            <p><strong>创建用户</strong></p>
        </header>
        <form id="create-user-form">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>

            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required>

            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>

            <label for="role">角色</label>
            <select id="role" name="role">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
            </select>

            <div id="form-message" role="alert" hidden></div>

            <footer>
                <button type="submit">创建</button>
            </footer>
        </form>
    </article>
</dialog>

<script>
document.getElementById('create-user-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageEl = document.getElementById('form-message');
    messageEl.hidden = true;

    const body = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
    };

    try {
        const token = localStorage.getItem('token') || getCookie('token');
        const res = await fetch('/api/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.success) {
            document.getElementById('create-user-modal').close();
            location.reload();
        } else {
            messageEl.className = 'warning';
            messageEl.textContent = data.message || '创建失败';
            messageEl.hidden = false;
        }
    } catch (err) {
        messageEl.className = 'danger';
        messageEl.textContent = '请求失败: ' + err.message;
        messageEl.hidden = false;
    }
});

function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}

async function deleteUser(id, username) {
    if (!confirm('确定要删除用户 "' + username + '" 吗？')) {
        return;
    }

    try {
        const token = localStorage.getItem('token') || getCookie('token');
        const res = await fetch('/api/users/' + id, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Bearer ' + token
            }
        });

        const data = await res.json();
        if (data.success) {
            location.reload();
        } else {
            alert(data.message || '删除失败');
        }
    } catch (err) {
        alert('请求失败: ' + err.message);
    }
}
</script>
{{end}}
