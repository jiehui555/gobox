{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">登录</h4>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
                <div id="message" class="mt-3 d-none"></div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageDiv = document.getElementById('message');
    messageDiv.className = 'mt-3 d-none';

    try {
        const result = await App.api('/web/login', {
            method: 'POST',
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });

        if (result.success) {
            App.setCookie('token', result.token, 1);
            messageDiv.className = 'mt-3 alert alert-success';
            messageDiv.textContent = result.message + '，正在跳转...';
            setTimeout(() => { window.location.href = '/'; }, 1000);
        } else {
            messageDiv.className = 'mt-3 alert alert-danger';
            messageDiv.textContent = result.message;
        }
    } catch {
        messageDiv.className = 'mt-3 alert alert-danger';
        messageDiv.textContent = '登录失败，请重试';
    }
});
</script>
{{end}}
