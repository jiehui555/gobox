{{define "content"}}
<article>
    <header>
        <nav>
            <ul>
                <li><strong>用户管理</strong> <small>共 {{len .Users}} 个用户</small></li>
            </ul>
            <ul>
                <li><button onclick="document.getElementById('create-user-modal').showModal()">创建用户</button></li>
            </ul>
        </nav>
    </header>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>角色</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {{range .Users}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Username}}</td>
                <td>{{.Email}}</td>
                <td>{{.Role}}</td>
                <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                <td>
                    <a href="#" onclick="editUser({{.ID}}, '{{.Username}}', '{{.Email}}', '{{.Role}}'); return false;" role="button" class="outline">编辑</a>
                    <a href="#" onclick="deleteUser({{.ID}}, '{{.Username}}'); return false;" role="button" class="outline secondary">删除</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</article>

<dialog id="create-user-modal">
    <article>
        <header>
            <button aria-label="Close" rel="prev" onclick="document.getElementById('create-user-modal').close()"></button>
            <p><strong>创建用户</strong></p>
        </header>
        <form id="create-user-form">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>

            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required>

            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>

            <label for="role">角色</label>
            <select id="role" name="role">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
            </select>

            <div id="form-message" style="display: none; margin-top: 1rem; padding: 1rem; border-radius: 4px;"></div>

            <footer>
                <button type="submit">创建</button>
            </footer>
        </form>
    </article>
</dialog>

<dialog id="edit-user-modal">
    <article>
        <header>
            <button aria-label="Close" rel="prev" onclick="document.getElementById('edit-user-modal').close()"></button>
            <p><strong>编辑用户</strong></p>
        </header>
        <form id="edit-user-form">
            <input type="hidden" id="edit-id">

            <label for="edit-username">用户名</label>
            <input type="text" id="edit-username" name="username" required>

            <label for="edit-email">邮箱</label>
            <input type="email" id="edit-email" name="email" required>

            <label for="edit-password">密码</label>
            <input type="password" id="edit-password" name="password" placeholder="留空则不修改">

            <label for="edit-role">角色</label>
            <select id="edit-role" name="role">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
            </select>

            <div id="edit-form-message" style="display: none; margin-top: 1rem; padding: 1rem; border-radius: 4px;"></div>

            <footer>
                <button type="submit">保存</button>
            </footer>
        </form>
    </article>
</dialog>

<script>
function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}

function getToken() {
    return localStorage.getItem('token') || getCookie('token');
}

document.getElementById('create-user-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageEl = document.getElementById('form-message');
    messageEl.style.display = 'none';

    const body = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
    };

    try {
        const res = await fetch('/web/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.success) {
            document.getElementById('create-user-modal').close();
            location.reload();
        } else {
            messageEl.style.backgroundColor = '#f8d7da';
            messageEl.style.color = '#721c24';
            messageEl.textContent = data.message || '创建失败';
            messageEl.style.display = 'block';
        }
    } catch (err) {
        messageEl.style.backgroundColor = '#f8d7da';
        messageEl.style.color = '#721c24';
        messageEl.textContent = '请求失败: ' + err.message;
        messageEl.style.display = 'block';
    }
});

function editUser(id, username, email, role) {
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-username').value = username;
    document.getElementById('edit-email').value = email;
    document.getElementById('edit-password').value = '';
    document.getElementById('edit-role').value = role;
    document.getElementById('edit-form-message').style.display = 'none';
    document.getElementById('edit-user-modal').showModal();
}

document.getElementById('edit-user-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageEl = document.getElementById('edit-form-message');
    messageEl.style.display = 'none';

    const id = document.getElementById('edit-id').value;
    const body = {
        username: document.getElementById('edit-username').value,
        email: document.getElementById('edit-email').value,
        password: document.getElementById('edit-password').value,
        role: document.getElementById('edit-role').value
    };

    try {
        const res = await fetch('/web/users/' + id, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.success) {
            document.getElementById('edit-user-modal').close();
            location.reload();
        } else {
            messageEl.style.backgroundColor = '#f8d7da';
            messageEl.style.color = '#721c24';
            messageEl.textContent = data.message || '更新失败';
            messageEl.style.display = 'block';
        }
    } catch (err) {
        messageEl.style.backgroundColor = '#f8d7da';
        messageEl.style.color = '#721c24';
        messageEl.textContent = '请求失败: ' + err.message;
        messageEl.style.display = 'block';
    }
});

async function deleteUser(id, username) {
    if (!confirm('确定要删除用户 "' + username + '" 吗？')) {
        return;
    }

    try {
        const res = await fetch('/web/users/' + id, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Bearer ' + getToken()
            }
        });

        const data = await res.json();
        if (data.success) {
            location.reload();
        } else {
            alert(data.message || '删除失败');
        }
    } catch (err) {
        alert('请求失败: ' + err.message);
    }
}
</script>
{{end}}
