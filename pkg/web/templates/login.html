{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">登录</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">记住我</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
                <div id="message" class="mt-3 alert" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<script>
function setCookie(name, value, days) {
    let expires = "";
    if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    
    try {
        const response = await fetch('/web/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
            setCookie('token', result.token, 1);
            messageDiv.className = 'mt-3 alert alert-success';
            messageDiv.textContent = result.message + '，正在跳转...';
            messageDiv.style.display = 'block';
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        } else {
            messageDiv.className = 'mt-3 alert alert-danger';
            messageDiv.textContent = result.message;
            messageDiv.style.display = 'block';
        }
    } catch (error) {
        messageDiv.className = 'mt-3 alert alert-danger';
        messageDiv.textContent = '登录失败，请重试';
        messageDiv.style.display = 'block';
    }
});
</script>
{{end}}
