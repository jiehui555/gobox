{{define "content"}}
<div class="card">
    <div class="card-body">
        <h3 class="card-title">欢迎使用 Gobox 管理后台</h3>
        <p class="card-text">这是一个基于 Huma 框架和 Bootstrap 5 构建的管理后台。</p>
        <p id="userInfo" class="text-muted"></p>
    </div>
</div>

<script>
function getCookie(name) {
    const value = "; " + document.cookie;
    const parts = value.split("; " + name + "=");
    if (parts.length === 2) return parts.pop().split(";").shift();
    return null;
}

async function loadUserInfo() {
    const token = getCookie('token');
    
    if (!token) {
        return;
    }
    
    try {
        const response = await fetch('/web/auth/check', {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        });
        
        const result = await response.json();
        
        if (result.authenticated && result.user) {
            document.getElementById('userInfo').textContent = 
                '当前登录用户: ' + result.user.username + ' (' + result.user.email + ')';
        }
    } catch (error) {
        console.error('获取用户信息失败:', error);
    }
}

loadUserInfo();
</script>
{{end}}
