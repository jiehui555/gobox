{{define "content"}}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">用户管理 <small class="text-muted">共 {{len .Users}} 个用户</small></h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal" data-action="create">
            <i class="bi bi-plus-lg me-1"></i>创建用户
        </button>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th class="d-none d-md-table-cell">ID</th>
                    <th>用户名</th>
                    <th class="d-none d-lg-table-cell">邮箱</th>
                    <th>角色</th>
                    <th class="d-none d-sm-table-cell">创建时间</th>
                    <th class="text-end">操作</th>
                </tr>
            </thead>
            <tbody>
                {{range .Users}}
                <tr>
                    <td class="d-none d-md-table-cell">{{.ID}}</td>
                    <td>{{.Username}}</td>
                    <td class="d-none d-lg-table-cell">{{.Email}}</td>
                    <td><span class="badge {{if eq .Role "admin"}}bg-warning text-dark{{else}}bg-secondary{{end}}">{{.Role}}</span></td>
                    <td class="d-none d-sm-table-cell">{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                    <td class="text-end">
                        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal"
                            data-action="edit" data-id="{{.ID}}" data-username="{{.Username}}" data-email="{{.Email}}" data-role="{{.Role}}">
                            编辑
                        </button>
                        <button class="btn btn-outline-danger btn-sm" data-action="delete" data-id="{{.ID}}" data-username="{{.Username}}">
                            删除
                        </button>
                    </td>
                </tr>
                {{end}}
            </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="userModalTitle">用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="userForm">
                <div class="modal-body">
                    <input type="hidden" id="formId">
                    <div class="mb-3">
                        <label for="formUsername" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="formUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="formEmail" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="formEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="formPassword" class="form-label">密码</label>
                        <input type="password" class="form-control" id="formPassword">
                        <div class="form-text" id="passwordHint"></div>
                    </div>
                    <div class="mb-3">
                        <label for="formRole" class="form-label">角色</label>
                        <select class="form-select" id="formRole">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div id="formMessage" class="d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary" id="formSubmitBtn">创建</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const userModal = document.getElementById('userModal');
const userForm = document.getElementById('userForm');

userModal.addEventListener('show.bs.modal', function(e) {
    const btn = e.relatedTarget;
    const action = btn.dataset.action;
    const messageEl = document.getElementById('formMessage');
    messageEl.className = 'd-none';

    document.getElementById('userModalTitle').textContent = action === 'create' ? '创建用户' : '编辑用户';
    document.getElementById('formSubmitBtn').textContent = action === 'create' ? '创建' : '保存';
    document.getElementById('passwordHint').textContent = action === 'create' ? '' : '留空则不修改';
    document.getElementById('formPassword').required = action === 'create';

    if (action === 'edit') {
        document.getElementById('formId').value = btn.dataset.id;
        document.getElementById('formUsername').value = btn.dataset.username;
        document.getElementById('formEmail').value = btn.dataset.email;
        document.getElementById('formRole').value = btn.dataset.role;
        document.getElementById('formPassword').value = '';
    } else {
        userForm.reset();
        document.getElementById('formId').value = '';
    }
});

userForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageEl = document.getElementById('formMessage');
    messageEl.className = 'd-none';

    const id = document.getElementById('formId').value;
    const isEdit = !!id;
    const body = {
        username: document.getElementById('formUsername').value,
        email: document.getElementById('formEmail').value,
        password: document.getElementById('formPassword').value,
        role: document.getElementById('formRole').value
    };

    try {
        const url = isEdit ? '/web/users/' + id : '/web/users';
        const result = await App.api(url, { method: isEdit ? 'PUT' : 'POST', body: JSON.stringify(body) });

        if (result.success) {
            bootstrap.Modal.getInstance(userModal).hide();
            location.reload();
        } else {
            messageEl.className = 'alert alert-danger';
            messageEl.textContent = result.message || (isEdit ? '更新失败' : '创建失败');
        }
    } catch (err) {
        messageEl.className = 'alert alert-danger';
        messageEl.textContent = '请求失败: ' + err.message;
    }
});

document.querySelectorAll('[data-action="delete"]').forEach(function(btn) {
    btn.addEventListener('click', async function() {
        if (!confirm('确定要删除用户 "' + this.dataset.username + '" 吗？')) return;
        try {
            const result = await App.api('/web/users/' + this.dataset.id, { method: 'DELETE' });
            if (result.success) {
                location.reload();
            } else {
                alert(result.message || '删除失败');
            }
        } catch (err) {
            alert('请求失败: ' + err.message);
        }
    });
});
</script>
{{end}}
