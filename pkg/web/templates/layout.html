{{define "layout"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Gobox 管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>Gobox 管理后台</strong></li>
        </ul>
        <ul>
            <li><a href="/">首页</a></li>
            <li><a href="/users">用户管理</a></li>
            <li><a href="/docs">API 文档</a></li>
            <li>
                <select id="themeSelect" onchange="changeTheme(this.value)" aria-label="切换主题" style="width: auto; padding: 0.3rem 0.5rem; margin-bottom: 0;">
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                    <option value="gray">灰色</option>
                    <option value="slate">石板灰</option>
                    <option value="blue">蓝色</option>
                    <option value="green">绿色</option>
                    <option value="red">红色</option>
                    <option value="purple">紫色</option>
                    <option value="orange">橙色</option>
                </select>
            </li>
            <li><a href="#" id="logoutBtn" onclick="logout(); return false;" style="display:none">退出</a></li>
        </ul>
    </nav>
    <main class="container">
        {{template "content" .}}
    </main>
    <script>
    function getCookie(name) {
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
    }

    function deleteCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax";
    }

    function checkAuth() {
        const token = getCookie('token');
        if (token) {
            document.getElementById('logoutBtn').style.display = '';
        }
    }

    function changeTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }

    function initTheme() {
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var select = document.getElementById('themeSelect');
        if (select) {
            select.value = theme;
        }
    }

    async function logout() {
        try {
            await fetch('/web/logout', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + getCookie('token')
                }
            });
        } catch (e) {
            // 忽略错误，直接清除本地状态
        }
        
        deleteCookie('token');
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    checkAuth();
    initTheme();
    </script>
</body>
</html>
{{end}}
