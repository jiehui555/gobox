{{define "content"}}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">用户管理 <small class="text-muted">共 {{len .Users}} 个用户</small></h5>
        <button class="btn btn-primary btn-sm" onclick="new bootstrap.Modal(document.getElementById('create-user-modal')).show()">创建用户</button>
    </div>
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {{range .Users}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Username}}</td>
                    <td>{{.Email}}</td>
                    <td><span class="badge bg-secondary">{{.Role}}</span></td>
                    <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm" onclick="editUser({{.ID}}, '{{.Username}}', '{{.Email}}', '{{.Role}}')">编辑</button>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteUser({{.ID}}, '{{.Username}}')">删除</button>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="create-user-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">创建用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="create-user-form">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">角色</label>
                        <select class="form-select" id="role" name="role">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div id="form-message" class="alert" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="edit-user-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="edit-user-form">
                <div class="modal-body">
                    <input type="hidden" id="edit-id">
                    <div class="mb-3">
                        <label for="edit-username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="edit-username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="edit-email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-password" class="form-label">密码</label>
                        <input type="password" class="form-control" id="edit-password" name="password" placeholder="留空则不修改">
                    </div>
                    <div class="mb-3">
                        <label for="edit-role" class="form-label">角色</label>
                        <select class="form-select" id="edit-role" name="role">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div id="edit-form-message" class="alert" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}

function getToken() {
    return localStorage.getItem('token') || getCookie('token');
}

document.getElementById('create-user-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageEl = document.getElementById('form-message');
    messageEl.style.display = 'none';

    const body = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
    };

    try {
        const res = await fetch('/web/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('create-user-modal')).hide();
            location.reload();
        } else {
            messageEl.className = 'alert alert-danger';
            messageEl.textContent = data.message || '创建失败';
            messageEl.style.display = 'block';
        }
    } catch (err) {
        messageEl.className = 'alert alert-danger';
        messageEl.textContent = '请求失败: ' + err.message;
        messageEl.style.display = 'block';
    }
});

function editUser(id, username, email, role) {
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-username').value = username;
    document.getElementById('edit-email').value = email;
    document.getElementById('edit-password').value = '';
    document.getElementById('edit-role').value = role;
    document.getElementById('edit-form-message').style.display = 'none';
    new bootstrap.Modal(document.getElementById('edit-user-modal')).show();
}

document.getElementById('edit-user-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const messageEl = document.getElementById('edit-form-message');
    messageEl.style.display = 'none';

    const id = document.getElementById('edit-id').value;
    const body = {
        username: document.getElementById('edit-username').value,
        email: document.getElementById('edit-email').value,
        password: document.getElementById('edit-password').value,
        role: document.getElementById('edit-role').value
    };

    try {
        const res = await fetch('/web/users/' + id, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify(body)
        });

        const data = await res.json();

        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('edit-user-modal')).hide();
            location.reload();
        } else {
            messageEl.className = 'alert alert-danger';
            messageEl.textContent = data.message || '更新失败';
            messageEl.style.display = 'block';
        }
    } catch (err) {
        messageEl.className = 'alert alert-danger';
        messageEl.textContent = '请求失败: ' + err.message;
        messageEl.style.display = 'block';
    }
});

async function deleteUser(id, username) {
    if (!confirm('确定要删除用户 "' + username + '" 吗？')) {
        return;
    }

    try {
        const res = await fetch('/web/users/' + id, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Bearer ' + getToken()
            }
        });

        const data = await res.json();
        if (data.success) {
            location.reload();
        } else {
            alert(data.message || '删除失败');
        }
    } catch (err) {
        alert('请求失败: ' + err.message);
    }
}
</script>
{{end}}
