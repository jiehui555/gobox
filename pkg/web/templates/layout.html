{{define "layout"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Gobox 管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>Gobox 管理后台</strong></li>
        </ul>
        <ul>
            <li><a href="/">首页</a></li>
            <li><a href="/users">用户管理</a></li>
            <li><a href="/docs">API 文档</a></li>
            <li>
                <a href="#" id="themeToggle" onclick="toggleTheme(); return false;" role="button" class="outline" style="padding: 0.3rem 0.8rem; margin-bottom: 0;">🌙</a>
            </li>
            <li><a href="#" id="logoutBtn" onclick="logout(); return false;" style="display:none">退出</a></li>
        </ul>
    </nav>
    <main class="container">
        {{template "content" .}}
    </main>
    <script>
    function getCookie(name) {
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
    }

    function deleteCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax";
    }

    function checkAuth() {
        const token = getCookie('token');
        if (token) {
            document.getElementById('logoutBtn').style.display = '';
        }
    }

    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon(next);
    }

    function updateThemeIcon(theme) {
        var btn = document.getElementById('themeToggle');
        if (btn) {
            btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }
    }

    function initTheme() {
        var theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        updateThemeIcon(theme);
    }

    async function logout() {
        try {
            await fetch('/web/logout', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + getCookie('token')
                }
            });
        } catch (e) {
            // 忽略错误，直接清除本地状态
        }
        
        deleteCookie('token');
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    checkAuth();
    initTheme();
    </script>
</body>
</html>
{{end}}
